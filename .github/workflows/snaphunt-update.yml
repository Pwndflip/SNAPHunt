
name: SnapHunt – Feste Updates

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: snaphunt-fixed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python vorbereiten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Codegenerierung korrigieren
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          if not path.exists():
              raise SystemExit("FEHLER: index.html nicht gefunden.")

          html = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"/\*GEN\*/.*?/\*ENDGEN\*/",
              re.DOTALL
          )

          replacement = r"""/*GEN*/
          const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
          const rc=n=>{
            let s='';
            do {
              s=Array.from(
                {length:n},
                ()=>AL[Math.random()*AL.length|0]
              ).join('');
            } while(s.includes('67')||s.includes('69'));
            return s;
          };
          const gen=()=>{
            const r=Math.random()*100;
            let t=0;
            const hit=p=>(t+=p)>r;
            if(hit(.67))return '6767';
            if(hit(10))return 'EMIR';
            if(hit(5))return 'EYMN';
            if(hit(3))return 'SNAP';
            return rc(4);
          };
          /*ENDGEN*/"""

          html, count = pattern.subn(
              lambda _: replacement,
              html,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "FEHLER: Codegenerator-Marker fehlen "
                  "oder sind nicht eindeutig."
              )

          # Footer an allen vorhandenen Stellen aktualisieren.
          html = html.replace(
              "Made by Emir with hard work💔",
              "Made by Emir mit harter Arbeit."
          )

          # Sicherheitsprüfungen
          match = pattern.search(html)
          if not match:
              raise SystemExit("FEHLER: Generator fehlt nach dem Update.")

          generator = match.group()
          for required in (
              "if(hit(.67))return '6767'",
              "return 'EMIR'",
              "return 'EYMN'",
              "return 'SNAP'",
              "s.includes('67')",
              "s.includes('69')"
          ):
              if required not in generator:
                  raise SystemExit(
                      f"Prüfung fehlgeschlagen: {required}"
                  )

          if "return '6969'" in generator:
              raise SystemExit("FEHLER: 6969 ist noch enthalten.")

          path.write_text(html, encoding="utf-8")
          print("Codegenerator erfolgreich aktualisiert.")
          print("6767: 0,67 %; Namen bleiben erhalten.")
          print("Zufallscodes mit 67 oder 69 werden verworfen.")
          PY

      - name: Änderungen als Pull Request bereitstellen
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/snaphunt-fixed-update
          delete-branch: false
          commit-message: "Fix SnapHunt special code probabilities"
          title: "SnapHunt: Spezialcodes korrigieren"
          body: |
            Änderungen:
            - 6767 hat eine Wahrscheinlichkeit von 0,67 %.
            - 6969 wird nicht mehr als Spezialcode generiert.
            - Zufallscodes mit 67 oder 69 werden verworfen.
            - EMIR, EYMN und SNAP bleiben erhalten.
            - Footer-Text wird auf Deutsch gesetzt.

            Bitte vor dem Merge testen.
