 <div class="card"><b>⚔️ Duell · ±10</b><p>${near.length?'Fordere ein Team in 40 m Nähe heraus (Schere-Stein-Papier).':'Niemand in 40 m Nähe.'}</p>${near.map(([k,x])=>`<button class="b duel" data-k="${k}">${esc(x.n)}</button>`).join('')}</div>
 <div class="card"><b>📦 Paket · +20</b><p>${pk?(pk.car?pk.car.n+' trägt das Paket. Bleib 1 Minute in 20 m Nähe, um es zu klauen.':'Hol das Paket bei 📦 und bring es zur 🏁 (ca. 5 Min Fahrt).'):'Das nächste Paket erscheint bald.'}</p></div>
 <h2 style="margin:14px 0 8px">Items</h2>`+US.map(([i,l,c,d])=>`<div class="card"><b>${l} · −${c}</b><p>${d}</p><button class="b p use" data-i="${i}" ${p<c?'disabled':''}>Einsetzen</button></div>`).join('');
 $$('.duel').forEach(b=>b.onclick=()=>{const k=b.dataset.k;set(R('f/'+id+'_'+k),{a:id,b:k,an:me.n,bn:S.p[k].n,ts:now()});$('#qs').classList.remove('on')});
 $$('.use').forEach(b=>b.onclick=()=>use(b.dataset.i))}
function use(i){const c=US.find(u=>u[0]==i)[2],m=S.p[id];if((m.pts||0)<c)return;
 if(i=='sn'){const o=Object.entries(S.p).filter(([k,x])=>x.tm&&x.tm!=G.my&&!x.out&&x.la);if(!o.length)return toast('Gerade kein Gegner auffindbar');const[k]=o[Math.random()*o.length|0];sn={k,u:now()+2e4};ev('sn',{to:k});toast('Verpetzt! Du siehst den Gegner 20 s lang.')}
 else if(i=='hid'){update(Pf(id),{hid:1});toast('Beim nächsten Ping bist du unsichtbar.')}
 else{ev('xp',{s:G.my})}
 pts(id,-c);$('#qs').classList.remove('on')}
$('#qb').onclick=()=>{$('#qs').classList.add('on');quests()};$('#qx').onclick=()=>$('#qs').classList.remove('on');

/* ===== Chat & Tag ===== */
function addC(m){const d=document.createElement('div');d.className='cm'+(m.i==id?' me':'');d.innerHTML=`<small>${esc(m.f)}</small>${esc(m.m)}`;$('#cl').append(d);$('#cl').scrollTop=1e9;if(!$('#chat').classList.contains('on')){$('#bd').hidden=false;navigator.vibrate&&navigator.vibrate(60)}}
$('#ch').onclick=()=>{$('#chat').classList.add('on');$('#bd').hidden=true};$('#cx').onclick=()=>$('#chat').classList.remove('on');
$('#cf').onsubmit=e=>{e.preventDefault();const v=$('#ci').value.trim();if(!v)return;$('#ci').value='';push(window._cr,{i:id,f:me.n,m:v})};
$('#tg').onclick=()=>{if(confirm('Wurdest du wirklich getaggt? Du bist dann raus, kannst aber weiter zuschauen.')){update(Pf(id),{out:1});ev('out',{n:me.n});$('#tg').hidden=true}};
$('#ce').onclick=()=>pos&&gm.setView(pos,17);

/* ===== Ende ===== */
function endGame(){G.over=1;stopGeo();clearInterval(iv);$('#alarm').classList.remove('on');try{wl&&wl.release()}catch(e){}
 const w=S.w,won=w==G.my,m=S.p[id]||{};
 $('#oh').textContent=won?(G.my=='r'&&m.out?'Team gewonnen!':G.my=='r'?'Du hast überlebt!':'Ihr habt gewonnen!'):'Diesmal nicht.';
 $('#od').textContent=w=='h'?'Alle SnapRunner wurden getaggt.':'Die Zeit ist abgelaufen – SnapRunner haben sich versteckt gehalten.';
 $('#ol').innerHTML=PL().sort((a,b)=>(b.pts||0)-(a.pts||0)).map(p=>`<div class="pr">${av(p)}<span class="pn">${esc(p.n)}<small>${p.tm=='h'?'SnapHunter':p.out?'SnapRunner · getaggt':'SnapRunner · frei'}</small></span><span class="rt">⭐ ${p.pts||0}</span></div>`).join('');
 show('over')}
$('#ob').onclick=()=>reset();
function reset(){const c=code,s=S;subs.forEach(u=>{try{u()}catch(e){}});subs=[];clearInterval(iv);stopGeo();try{wl&&wl.release()}catch(e){}
 if(c&&s&&s.s=='lobby'){try{host?remove(ref(db,'g/'+c)):remove(ref(db,'g/'+c+'/p/'+id))}catch(e){}}
 code='';S=null;G=null;had=0;HD=0;host=0;pos=null;sn=null;MK={};edge('x');$('#alarm').classList.remove('on');show('home')}
</script>
